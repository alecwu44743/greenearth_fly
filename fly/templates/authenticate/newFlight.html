<title>🌏 New Flight</title>
{% extends 'layout.html' %}
{% load static %}
{% block body %}

<!-- 導入 Bootstrap 的 CSS 檔案 -->
<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

<!-- 導入 DateTimePicker 的 CSS 檔案 -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datetimepicker/4.17.47/css/bootstrap-datetimepicker.min.css">

<!-- 導入 jQuery 和 Bootstrap 的 JavaScript 檔案 -->
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>

<!-- 導入 Moment.js 和 DateTimePicker 的 JavaScript 檔案 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.22.2/moment.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datetimepicker/4.17.47/js/bootstrap-datetimepicker.min.js"></script>


{% if user.is_authenticated and user.staffuserprofile and user.staffuserprofile.user_type == 'Office - FlightM' %}
    <div class="bg-white fPersian">
        <div class="shadow p-4 mb-5 bg-body bg-body rounded text-black  m-5">
            <h1 class="text-black p-3 ">New Flight</h1>
            <form method="POST" action="{% url 'newFlight' %}">
                {% csrf_token %}
        
                    {{ form.as_p }}
        
                    <br/>
                    <button type="submit" class="btn btn-primary">Add Flight</button>
                    </br>
            </form>
        </div>
        <br/><br/><br/>
    </div>

{% else %}
    <script>
        window.location.href = "{% url 'index' %}";
    </script>
{% endif %}
{% endblock %}
